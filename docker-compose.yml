# PostgreSQL for local development:  docker compose up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: stressguard
      POSTGRES_USER: stressguard
      POSTGRES_PASSWORD: stressguard
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
